name: Build Getz ABS Scanner APK

on:
  push:
    paths:
      - "getz-abs-scanner/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: getz-abs-scanner
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/getz-abs-scanner.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: getz-abs-scanner-apk
          path: getz-abs-scanner/app/build/outputs/apk/debug/getz-abs-scanner.apk
          if-no-files-found: error

      - name: Publish APK to a public Release
        if: github.ref == 'refs/heads/claude/estonian-learning-simulator-eXkAJ'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: getz-latest
          name: "Getz ABS Scanner — последняя сборка APK"
          body: |
            **getz-abs-scanner.apk** — установить на телефон (разрешите неизвестные источники).
            Диагностика Hyundai Getz через ELM327 Bluetooth: проверка адаптера,
            OBD-II двигатель, автоскан модулей (ABS), ручной KWP-режим.
            Собрано из коммита ${{ github.sha }}.
          files: |
            getz-abs-scanner/app/build/outputs/apk/debug/getz-abs-scanner.apk
          make_latest: true
