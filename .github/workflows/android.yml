name: Build Kuller APK

on:
  push:
    paths:
      - "estonian-courier-sim/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estonian-courier-sim
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/kuller.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuller-debug-apk
          path: estonian-courier-sim/app/build/outputs/apk/debug/kuller.apk
          if-no-files-found: error

      - name: Publish APK to a public Release
        if: github.ref == 'refs/heads/claude/estonian-learning-simulator-eXkAJ'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kuller-latest
          name: "Kuller — последняя сборка APK"
          body: |
            Скачайте **kuller.apk** ниже и установите на Android-телефон
            (разрешите установку из неизвестных источников).
            Собрано из коммита ${{ github.sha }}.
          files: estonian-courier-sim/app/build/outputs/apk/debug/kuller.apk
          make_latest: true
