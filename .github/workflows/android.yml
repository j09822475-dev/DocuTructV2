name: Build Kuller (Flutter)

on:
  push:
    paths:
      - "kuller_flutter/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuller_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold Android platform folder
        run: flutter create . --platforms=android --org ee.kuller --project-name kuller

      - name: Set app label
        run: sed -i 's/android:label="kuller"/android:label="Eesti keel"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      # Подпись ПОСТОЯННЫМ ключом: каждый новый APK ставится поверх старого
      # как обновление. Если в Secrets задан KULLER_KEYSTORE_BASE64 (+ _PASSWORD),
      # используется он; иначе — ключ из репозитория (signing/upload.jks).
      - name: Sign APK with persistent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KULLER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KULLER_KEYSTORE_PASSWORD }}
        run: |
          KS=signing/upload.jks
          PASS=eestikeel2026
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            KS="$RUNNER_TEMP/upload.jks"
            PASS="$KEYSTORE_PASSWORD"
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -4

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/kuller.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuller-apk
          path: kuller_flutter/build/kuller.apk
          if-no-files-found: error

      - name: Publish APK to a public Release
        if: github.ref == 'refs/heads/claude/estonian-learning-simulator-eXkAJ'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kuller-flutter-latest
          name: "Eesti keel A2 — последняя сборка"
          body: |
            Приложение для изучения эстонского языка: уроки по конспекту курса —
            слова, тексты, диалоги и тесты.
            **kuller.apk** — Android: установить на телефон (разрешите неизвестные источники).
            **kuller-ios-unsigned.ipa** — iOS: неподписанная сборка, ставится через Sideloadly/AltStore
            (появляется в релизе после окончания iOS-джобы).
            Собрано из коммита ${{ github.sha }}.
          files: |
            kuller_flutter/build/kuller.apk
          make_latest: true

  ios:
    runs-on: macos-latest
    needs: android
    defaults:
      run:
        working-directory: kuller_flutter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold iOS platform folder
        run: flutter create . --platforms=ios --org ee.kuller --project-name kuller

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Pack unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios/iphoneos/Runner.app build/Payload/
          cd build && zip -qr kuller-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuller-ios-unsigned-ipa
          path: kuller_flutter/build/kuller-ios-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to the Release
        if: github.ref == 'refs/heads/claude/estonian-learning-simulator-eXkAJ'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kuller-flutter-latest
          files: |
            kuller_flutter/build/kuller-ios-unsigned.ipa
